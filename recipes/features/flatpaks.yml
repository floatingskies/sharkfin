# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

# Note: There can only be one list of flatpaks, because this module can really
# only be run once per build. An apparent fix for this
# (see https://github.com/blue-build/modules/pull/263) doesn't do what we need --
# the fix only makes sure the effects of the 1st module run are not overwritten
# (any subsequent runs are ignored).
#
# These are installed at runtime on first boot (not baked into the image), and
# deliberately exclude apps the Bluefin base image already ships so nothing
# shows up twice in the app grid: Mission Center, Extension Manager, Bazaar,
# Warehouse and DistroShelf.

modules:
  - type: default-flatpaks
    configurations:
    - notify: true 
      scope: system
      install:
        # Base Flatpaks
        # (System Mgmt, Basic Productivity)
        - org.gtk.Gtk3theme.adw-gtk3
        - org.gtk.Gtk3theme.adw-gtk3-dark
        - org.gnome.Firmware
        - org.cockpit_project.CockpitClient
        - org.gnome.Logs
        - org.gnome.Calculator
        - org.gnome.TextEditor
        - org.gnome.font-viewer
        - org.gnome.FileRoller        
        - ca.desrt.dconf-editor
        - com.github.tchx84.Flatseal
        - org.gnome.Weather
        - org.gnome.Papers
        - org.gnome.Loupe
        - org.gnome.baobab
        - com.github.rafostar.Clapper
        - org.gnome.Snapshot 
        - org.libreoffice.LibreOffice        
        - org.fedoraproject.MediaWriter
        - org.gnome.SimpleScan
        - org.gustavoperedo.FontDownloader
        - org.gnome.NautilusPreviewer
        - com.github.PintaProject.Pinta
        - org.gnome.clocks
        - org.gnome.Connections
        - org.gnome.DejaDup

        # Personal Internet Life
        - com.discordapp.Discord
        - com.spotify.Client

        # Media/Art Production
        - org.gimp.GIMP 
        - org.audacityteam.Audacity
        - org.darktable.Darktable

        # Developer Tools
        - io.dbeaver.DBeaverCommunity
        - sh.loft.devpod
        - me.iepure.devtoolbox
        - io.podman_desktop.PodmanDesktop
